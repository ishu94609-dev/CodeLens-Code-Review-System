<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - CodeLens</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}?v=24">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="page">

    <div class="logo-container">
        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="CodeLens Logo"
        >
    </div>

    <div class="login-card">

        <h2>Reset Password</h2>

        <p class="subtitle">
            Create a new password for your account
        </p>

        {% if error %}
        <div style="
            color: #d93025;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        ">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST"
              action="{{ url_for('reset_password', token=token) }}">

            <div class="input-box">

                <div class="input-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <input
                    type="password"
                    name="password"
                    placeholder="New Password"
                    autocomplete="new-password"
                    required
                >

            </div>

            <div class="input-box">

                <div class="input-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    autocomplete="new-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-button"
            >
                Reset Password
            </button>

        </form>

        <div class="register-text">
            Remember your password?
            <a href="{{ url_for('login') }}">
                Login here
            </a>
        </div>

    </div>

    <div class="footer">

        <div class="footer-line">
            <span>
                © 2026 Code Review and Refactoring System.
            </span>
        </div>

        <div class="footer-rights">
            All rights reserved.
        </div>

    </div>

</div>

</body>
</html>
